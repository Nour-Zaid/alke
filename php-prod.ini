; Production PHP hardening (loaded into the container via the Dockerfile).
; Local XAMPP is unaffected (it uses its own php.ini).

; Do not leak errors/stack traces to visitors; log them instead.
display_errors = Off
display_startup_errors = Off
log_errors = On
expose_php = Off

; Session cookie hardening. Secure=On is safe because Railway serves HTTPS.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1
